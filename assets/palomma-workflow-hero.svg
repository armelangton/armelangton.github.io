<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
  <title id="title">AI workflow moving a request from intake to approval</title>
  <desc id="desc">An animated operations workspace showing a request captured, matched with context, summarized by AI, and approved by a person.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c29"/>
      <stop offset="1" stop-color="#07121d"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d353e"/>
      <stop offset="1" stop-color="#09242d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020a12" flood-opacity=".5"/>
    </filter>
    <style>
      .label{font:700 12px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#f4fbff}
      .micro{font:700 10px Inter,Arial,sans-serif;letter-spacing:1px;fill:#70ddd5}
      .small{font:500 12px Inter,Arial,sans-serif;fill:#d8e6ed}
      .strong{font:700 14px Inter,Arial,sans-serif;fill:#fff}
      .value{font:700 13px Inter,Arial,sans-serif;fill:#fff}
      .muted{font:500 11px Inter,Arial,sans-serif;fill:#9db1bf}
      .row{fill:#16212d;stroke:#2a3945;stroke-width:1.2}
      .icon{fill:#123943}
      .line{stroke:#344653;stroke-width:1}
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}
      .step1{animation-delay:0s}.step2{animation-delay:.45s}.step3{animation-delay:.9s}.step4{animation-delay:1.35s}
      .dot1{animation:dot 1.8s ease-in-out infinite}.dot2{animation:dot 1.8s .3s ease-in-out infinite}.dot3{animation:dot 1.8s .6s ease-in-out infinite}
      .scan{animation:scan 4.8s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
      @keyframes scan{0%{transform:translateX(-90px);opacity:0}15%{opacity:.5}55%{opacity:.18}100%{transform:translateX(520px);opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.dot1,.dot2,.dot3,.scan{animation:none}}
    </style>
  </defs>
  <g filter="url(#shadow)">
    <rect x="38" y="28" width="544" height="704" rx="18" fill="url(#panel)" stroke="#28404f" stroke-width="1.5"/>
    <rect class="scan" x="38" y="28" width="70" height="704" rx="18" fill="#69d9d0" opacity="0"/>
    <text x="68" y="72" class="label">OPERATIONS WORKSPACE</text>
    <text x="68" y="102" class="small">Launching AI operating layer</text>
    <circle cx="338" cy="88" r="4" fill="#2cc7bf" class="dot1"/>
    <circle cx="352" cy="88" r="4" fill="#2cc7bf" class="dot2"/>
    <circle cx="366" cy="88" r="4" fill="#2cc7bf" class="dot3"/>
    <rect x="418" y="54" width="134" height="64" rx="7" fill="#0d1b26" stroke="#2cc7bf" stroke-opacity=".75"/>
    <circle cx="438" cy="86" r="4" fill="#2cc7bf"/>
    <text x="452" y="80" class="micro">3 WORKFLOWS</text>
    <text x="452" y="98" class="micro">ACTIVE</text>

    <g class="pulse step1">
      <rect class="row" x="68" y="148" width="484" height="72" rx="9"/>
      <rect class="icon" x="84" y="164" width="46" height="40" rx="7"/>
      <path d="M107 174v19m-7-7 7 7 7-7" fill="none" stroke="#36d3c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="152" y="178" class="muted">INCOMING</text><text x="152" y="199" class="strong">New request captured</text>
      <path d="m527 178 5 6-5 6" fill="none" stroke="#fff" stroke-width="2.4"/>
    </g>
    <g class="pulse step2">
      <rect class="row" x="68" y="230" width="484" height="72" rx="9"/>
      <rect class="icon" x="84" y="246" width="46" height="40" rx="7"/>
      <path d="M98 258h18M98 264h18M98 270h18" stroke="#36d3c9" stroke-width="2" stroke-linecap="round"/>
      <text x="152" y="260" class="muted">CONTEXT</text><text x="152" y="281" class="strong">CRM and documents matched</text>
      <path d="m527 260 5 6-5 6" fill="none" stroke="#fff" stroke-width="2.4"/>
    </g>
    <g class="pulse step3">
      <rect class="row" x="68" y="312" width="484" height="72" rx="9"/>
      <rect class="icon" x="84" y="328" width="46" height="40" rx="7"/>
      <path d="m107 337 3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#36d3c9"/>
      <text x="152" y="342" class="muted">AI SUPPORT</text><text x="152" y="363" class="strong">Summarize and recommend</text>
      <path d="m527 342 5 6-5 6" fill="none" stroke="#fff" stroke-width="2.4"/>
    </g>
    <g class="pulse step4">
      <rect x="68" y="394" width="484" height="72" rx="9" fill="url(#active)" stroke="#2dd8ce" stroke-width="1.4"/>
      <rect x="68" y="394" width="5" height="72" rx="3" fill="#2dd8ce"/>
      <rect class="icon" x="84" y="410" width="46" height="40" rx="7"/>
      <circle cx="107" cy="430" r="5" fill="none" stroke="#36d3c9" stroke-width="2"/>
      <text x="152" y="424" class="muted">HUMAN REVIEW</text><text x="152" y="445" class="strong">Approve and move forward</text>
      <path d="m527 424 5 6-5 6" fill="none" stroke="#fff" stroke-width="2.4"/>
    </g>

    <line x1="68" y1="484" x2="552" y2="484" class="line"/>
    <rect x="68" y="502" width="154" height="112" rx="8" fill="#0b151e" stroke="#2a3945"/>
    <text x="84" y="528" class="micro">WORKFLOW</text><text x="84" y="557" class="value">Human approval</text>
    <rect x="234" y="502" width="154" height="112" rx="8" fill="#0b242c" stroke="#2dd8ce"/>
    <text x="250" y="528" class="micro">NEXT ACTION</text><text x="250" y="557" class="value">Review</text><text x="250" y="578" class="value">recommendation</text><text x="250" y="599" class="value">and approve</text>
    <rect x="400" y="502" width="152" height="112" rx="8" fill="#0b151e" stroke="#2a3945"/>
    <text x="416" y="528" class="micro">STATUS</text><text x="416" y="557" class="value">Ready to send</text>
    <line x1="68" y1="632" x2="552" y2="632" class="line"/>
    <text x="68" y="662" class="small">› sync services</text>
    <text x="68" y="695" class="micro">approval complete · workflow moving forward</text>
    <circle cx="426" cy="691" r="4" fill="#2cc7bf" class="dot1"/><circle cx="440" cy="691" r="4" fill="#2cc7bf" class="dot2"/><circle cx="454" cy="691" r="4" fill="#2cc7bf" class="dot3"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Objection Handling Coach</title>
  <desc id="desc">An objection handling coach shows a managed IT provider objection and a suggested response.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0b2d4a" flood-opacity="0.10"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fcff"/><stop offset="1" stop-color="#edf8fb"/></linearGradient>
  </defs>
  <rect width="1200" height="900" rx="34" fill="url(#bg)"/>
  <path d="M34 0h1132a34 34 0 0 1 34 34v90H0V34A34 34 0 0 1 34 0Z" fill="#071a2d"/>
  <text x="44" y="78" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Objection Handling Coach</text>
  <rect x="168" y="164" width="968" height="108" rx="32" fill="#dceaff"/>
  <text x="652" y="230" text-anchor="middle" fill="#071a2d" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">We have a managed IT provider.</text>
  <rect x="88" y="324" width="1024" height="410" rx="30" fill="#ffffff" stroke="#a7e5e3" stroke-width="2" filter="url(#shadow)"/>
  <text x="132" y="410" fill="#12a5a1" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Respond:</text>
  <text x="132" y="490" fill="#17324d" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="500">
    <tspan x="132" dy="0">“Oh, ok, I understand. Is that someone who works in</tspan>
    <tspan x="132" dy="52">your company or do they work for an outside IT</tspan>
    <tspan x="132" dy="52">provider?”</tspan>
  </text>
  <rect x="88" y="774" width="1024" height="84" rx="24" fill="#ffffff" stroke="#d7e3eb" stroke-width="2"/>
  <text x="126" y="827" fill="#8da1b2" font-family="Inter, Arial, sans-serif" font-size="29">Type your follow-up…</text>
</svg>
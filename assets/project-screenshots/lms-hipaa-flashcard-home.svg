<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc"><title id="title">HIPAA cybersecurity flashcard</title><desc id="desc">Two flashcards showing a HIPAA cybersecurity question and answer.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#071a2d" flood-opacity=".10"/></filter><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2d6fb7"/><stop offset="1" stop-color="#0a52d7"/></linearGradient></defs><rect width="1672" height="941" fill="#f7fbff"/><g font-family="Inter,Arial,sans-serif" filter="url(#s)"><rect x="68" y="60" width="726" height="820" rx="30" fill="#fff" stroke="#d8e4ef"/><text x="112" y="132" font-size="27" font-weight="700" fill="#071a2d">Cybersecurity &amp; Compliance Foundations</text><rect x="642" y="98" width="116" height="42" rx="18" fill="#edf4ff"/><text x="700" y="127" font-size="20" font-weight="700" text-anchor="middle" fill="#1666db">Card 1 of 18</text><rect x="112" y="172" width="570" height="10" rx="5" fill="#e7eef7"/><rect x="112" y="172" width="57" height="10" rx="5" fill="#1666db"/><text x="728" y="190" font-size="21" font-weight="700" fill="#071a2d">6%</text><rect x="102" y="216" width="658" height="510" rx="26" fill="#fff" stroke="#e0e8f1"/><circle cx="166" cy="287" r="42" fill="#eef5ff"/><rect x="146" y="270" width="40" height="28" rx="6" fill="none" stroke="#1666db" stroke-width="3"/><circle cx="158" cy="284" r="2.8" fill="#1666db"/><circle cx="166" cy="284" r="2.8" fill="#1666db"/><circle cx="174" cy="284" r="2.8" fill="#1666db"/><path d="M158 298l-7 9v-9" fill="none" stroke="#1666db" stroke-width="3"/><text x="140" y="430" font-size="54" font-weight="700" fill="#071a2d"><tspan x="140" dy="0">How does HIPAA</tspan><tspan x="140" dy="72">relate to</tspan><tspan x="140" dy="72">cybersecurity?</tspan></text><circle cx="148" cy="682" r="8" fill="#1666db"/><circle cx="178" cy="682" r="8" fill="#d6e2ef"/><circle cx="208" cy="682" r="8" fill="#d6e2ef"/><rect x="105" y="766" width="288" height="70" rx="14" fill="#fff" stroke="#1666db" stroke-width="2"/><text x="249" y="809" text-anchor="middle" font-size="24" font-weight="600" fill="#1666db">Flip card</text><rect x="468" y="766" width="286" height="70" rx="14" fill="#fff" stroke="#9aabc1" stroke-width="2"/><text x="611" y="809" text-anchor="middle" font-size="24" font-weight="600" fill="#071a2d">Review later</text><rect x="844" y="60" width="760" height="820" rx="30" fill="#fff" stroke="#d8e4ef"/><rect x="874" y="102" width="700" height="628" rx="26" fill="url(#b)"/><text x="916" y="202" font-size="82" font-weight="700" fill="#59ddd8">“</text><text x="916" y="300" font-size="39" font-weight="600" fill="#fff"><tspan x="916" dy="0">HIPAA requires organizations</tspan><tspan x="916" dy="58">to protect sensitive health</tspan><tspan x="916" dy="58">information. Cybersecurity</tspan><tspan x="916" dy="58">supports HIPAA by helping secure</tspan><tspan x="916" dy="58">ePHI through access controls,</tspan><tspan x="916" dy="58">risk management, monitoring,</tspan><tspan x="916" dy="58">backups, and incident response.</tspan></text><path d="M1450 162h58v46h-36l-15 14v-14h-7z" fill="none" stroke="#63e0dc" stroke-width="5"/><circle cx="1438" cy="210" r="24" fill="none" stroke="#63e0dc" stroke-width="5"/><path d="M1398 262c9-27 71-27 80 0" fill="none" stroke="#63e0dc" stroke-width="5"/><g fill="#63e0dc"><circle cx="920" cy="682" r="7"/><circle cx="948" cy="682" r="7"/><circle cx="976" cy="682" r="7"/><circle cx="1004" cy="682" r="7"/></g><rect x="874" y="766" width="300" height="70" rx="14" fill="#fff" stroke="#1666db" stroke-width="2"/><text x="1024" y="809" text-anchor="middle" font-size="24" font-weight="600" fill="#1666db">Practice again</text><rect x="1210" y="766" width="364" height="70" rx="14" fill="#1666db"/><text x="1392" y="809" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">✓  Know it</text></g></svg>
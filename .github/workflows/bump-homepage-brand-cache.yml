name: Bump homepage brand cache

on:
  push:
    branches:
      - fix/homepage-brand-cache-20260819
    paths:
      - .github/workflows/bump-homepage-brand-cache.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-brand-cache-20260819
      - name: Bump brand stylesheet cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = './brand.css?v=20260808-1'
          new = './brand.css?v=20260819-seven-segment-logo'
          if old not in text:
              raise SystemExit(f'Expected cache key not found: {old}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/bump-homepage-brand-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-homepage-brand-cache.yml
          git commit -m "Bust homepage Palomma brand stylesheet cache"
          git push origin HEAD:fix/homepage-brand-cache-20260819

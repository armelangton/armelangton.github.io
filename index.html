<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Palomma Consulting builds AI around the way your business works, combining AI, automation, systems, and process improvement." />
  <title>Palomma Consulting | AI Built Around Your Business</title>
  <link rel="icon" href="./assets/logo.png" sizes="64x64" type="image/png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./services.css?v=20260801-3" />
  <link rel="stylesheet" href="./services-visual.css?v=20260801-7" />
  <link rel="stylesheet" href="./offers-grouping.css?v=20260807-3" />
  <link rel="stylesheet" href="./home-services-theme.css?v=20260801-3" />
  <link rel="stylesheet" href="./home-original-sections.css?v=20260802-7" />
  <style>
    html.is-loading body{visibility:hidden}
    .home-services-page .page-hero-inner h1{font-family:Lora,Georgia,serif;font-weight:600;letter-spacing:-.035em}
  </style>
  <script>document.documentElement.classList.add('is-loading');</script>
</head>
<body class="home-services-page">
  <main id="homepage-root" aria-live="polite"></main>
  <noscript><p style="padding:2rem;font-family:Inter,sans-serif">Please enable JavaScript to view the Palomma Consulting homepage.</p></noscript>
  <script>
    (() => {
      const platforms = [
        ['Salesforce','salesforce'],['HubSpot','hubspot'],['Zoho','zoho'],
        ['Microsoft 365','microsoft365'],['Google Workspace','googleworkspace'],
        ['ChatGPT','openai'],['Claude','anthropic'],['Gemini','googlegemini'],
        ['Zapier','zapier'],['Slack','slack'],['LinkedIn','linkedin'],['Asana','asana']
      ];

      const faqItems = [
        ['How do I know which service is right for my business?', 'You do not need to identify the solution before contacting Palomma. Start with the business problem, where work is slowing down, or what your team needs to improve. We will help determine the right service, scope, and approach.'],
        ['Can Palomma work with the systems we already use?', 'Yes. We use the tools and systems your business already relies on whenever practical. The goal is to improve how work gets done, not replace useful software without a reason.'],
        ['How does pricing work?', 'Pricing depends on the service, implementation scope, systems involved, complexity, and any ongoing operational responsibility. Starting prices are shown where they can be stated responsibly; final scope is confirmed before work begins.'],
        ['What happens after launch?', 'That depends on the solution. Some work can be handed over after implementation, while other solutions include an ongoing operating component. We define that responsibility clearly before the engagement begins.'],
        ['How do you keep AI-supported work under human control?', 'AI-supported work is built around approved information, defined rules, testing, review points, and exception paths. When judgment, approval, or business authority is required, a person remains responsible for the decision.']
      ];

      function buildPlatforms() {
        const strip = document.createElement('section');
        strip.className = 'platforms-strip';
        strip.setAttribute('aria-labelledby','platforms-strip-title');
        const label = document.createElement('p');
        label.id = 'platforms-strip-title';
        label.className = 'platforms-strip-label';
        label.textContent = 'PLATFORMS WE WORK WITH';
        const marquee = document.createElement('div');
        marquee.className = 'platforms-marquee';
        const track = document.createElement('div');
        track.className = 'platforms-track';
        const addSet = hidden => platforms.forEach(([name,slug]) => {
          const item = document.createElement('div');
          item.className = 'platform-logo';
          if (hidden) item.setAttribute('aria-hidden','true');
          const image = document.createElement('img');
          image.src = `https://cdn.simpleicons.org/${slug}`;
          image.alt = hidden ? '' : `${name} logo`;
          image.loading = 'lazy';
          image.decoding = 'async';
          image.addEventListener('error',() => image.remove());
          const text = document.createElement('span');
          text.textContent = name;
          item.append(image,text);
          track.appendChild(item);
        });
        addSet(false);
        addSet(true);
        marquee.appendChild(track);
        strip.append(label,marquee);
        return strip;
      }

      function buildSelectedWork() {
        const work = document.createElement('section');
        work.id = 'case-studies';
        work.className = 'home-selected-work';
        work.setAttribute('aria-labelledby','selected-work-title');
        work.innerHTML = `
          <div class="container">
            <div class="section-heading"><h2 id="selected-work-title">See What Palomma Builds</h2></div>
            <div class="case-study-grid">
              <article class="case-study-card"><a href="./sales-enablement-platform.html"><img src="./assets/project-screenshots/sales-my-work-current.webp" alt="Sales Enablement Platform organizing prioritized work and account context" /><div><h3>Sales Enablement Platform</h3><p>One workspace for priorities, customer context, playbooks, learning, coaching, and AI guidance.</p><span>View case study <span aria-hidden="true">→</span></span></div></a></article>
              <article class="case-study-card"><a href="./fire-protection-platform.html"><img src="./assets/project-screenshots/fire-workbench-current-check.png" alt="Fire Protection Field Assistant showing an annual sprinkler inspection engagement" /><div><h3>Fire Protection Field Assistant</h3><p>A mobile field workflow for preparation, system checks, documentation, resources, and AI guidance.</p><span>View case study <span aria-hidden="true">→</span></span></div></a></article>
              <article class="case-study-card"><a href="./commercial-lighting-platform.html"><img src="./assets/project-screenshots/lit-sales-workspace-current.webp" alt="Commercial Lighting Intelligence Platform displaying a retrofit quote and bill of materials" /><div><h3>Commercial Lighting Intelligence Platform</h3><p>A quoting workspace for RFQ readiness, supplier pricing, product decisions, margin visibility, and proposals.</p><span>View case study <span aria-hidden="true">→</span></span></div></a></article>
              <article class="case-study-card"><a href="./learning-experience-platform.html"><img src="./assets/project-screenshots/lms-card-current.webp" alt="Learning Experience Platform displaying a discovery and qualification playbook" /><div><h3>Learning Experience Platform</h3><p>Structures onboarding, knowledge reinforcement, practice, and progress around the work employees need to perform.</p><span>View case study <span aria-hidden="true">→</span></span></div></a></article>
              <article class="case-study-card"><a href="./ai-objection-handling-assistant.html"><img src="./assets/project-screenshots/bdr-objection-coach-current.webp" alt="AI Objection Handling Coach with guided live-assist scenarios" /><div><h3>AI Objection Handling Assistant</h3><p>Helps sales representatives practice and respond to objections with context, discovery guidance, and next steps.</p><span>View case study <span aria-hidden="true">→</span></span></div></a></article>
            </div>
          </div>`;
        return work;
      }

      function buildFaq() {
        const faq = document.createElement('section');
        faq.id = 'faq';
        faq.className = 'section-wrapper homepage-faq-section';
        faq.setAttribute('aria-labelledby','faq-title');
        faq.innerHTML = `
          <div class="container homepage-faq-container">
            <div class="homepage-faq-heading"><h2 id="faq-title">Frequently Asked Questions</h2></div>
            <div class="homepage-faq-list">
              ${faqItems.map(([question,answer]) => `<details><summary>${question}</summary><p>${answer}</p></details>`).join('')}
            </div>
          </div>`;
        return faq;
      }

      function buildContact() {
        const contact = document.createElement('section');
        contact.id = 'contact';
        contact.className = 'section-wrapper contact-section';
        contact.innerHTML = `
          <div class="container">
            <div class="contact-cta-card">
              <div class="contact-copy"><h2>Let's Build Something Great.</h2></div>
              <div class="contact-links">
                <a href="mailto:armelangton@gmail.com">Get in Touch</a>
                <a href="tel:+13179706662">Call or Text 317-970-6662</a>
              </div>
            </div>
          </div>`;
        return contact;
      }

      function activateConsole() {
        const states = {
          incoming:['Request intake','Match business context','Captured','intake received · preparing context'],
          context:['Context assembly','Connect CRM and documents','Matched','records matched · context ready'],
          support:['AI assistance','Generate summary and recommendation','In progress','analysis running · recommendation drafted'],
          review:['Human approval','Review recommendation and approve','Ready to send','approval complete · workflow moving forward']
        };
        const buttons = [...document.querySelectorAll('.console-option')];
        const workflow = document.getElementById('workflow-value');
        const action = document.getElementById('action-value');
        const status = document.getElementById('status-value');
        const terminal = document.getElementById('terminal-value');
        if (!buttons.length || !workflow || !action || !status || !terminal) return;
        let index = 0;
        function select(button) {
          buttons.forEach(item => {
            const active = item === button;
            item.classList.toggle('is-active',active);
            item.setAttribute('aria-selected',String(active));
          });
          const [w,a,s,t] = states[button.dataset.stage];
          workflow.textContent = w;
          action.textContent = a;
          status.textContent = s;
          terminal.textContent = t;
          index = buttons.indexOf(button);
        }
        buttons.forEach(button => button.addEventListener('click',() => select(button)));
        window.setInterval(() => select(buttons[(index + 1) % buttons.length]),3200);
      }

      fetch('./services.html?v=20260807-offers-3')
        .then(response => {
          if (!response.ok) throw new Error(`Unable to load homepage architecture (${response.status})`);
          return response.text();
        })
        .then(html => {
          const parsed = new DOMParser().parseFromString(html,'text/html');
          const header = parsed.querySelector('.site-header');
          const main = parsed.querySelector('main');
          const footer = parsed.querySelector('.site-footer');
          const root = document.getElementById('homepage-root');
          if (!header || !main || !footer || !root) throw new Error('Homepage architecture is incomplete.');

          const hero = main.querySelector('.page-hero');
          if (hero) {
            const heroTitle = hero.querySelector('h1');
            const heroSummary = hero.querySelector('.page-hero-summary');
            if (heroTitle) heroTitle.textContent = 'AI built around the way your business works.';
            if (heroSummary) heroSummary.textContent = 'We use AI, automation, systems, and process improvement to make work easier, faster, and more effective.';
            const canvas = document.createElement('canvas');
            canvas.className = 'hero-network';
            canvas.setAttribute('aria-hidden','true');
            hero.prepend(canvas);
            hero.insertAdjacentElement('afterend',buildPlatforms());
          }

          const servicesSection = main.querySelector('#core-services');
          if (servicesSection) servicesSection.insertAdjacentElement('afterend',buildSelectedWork());

          main.querySelector('#faq')?.remove();
          const oldCta = main.querySelector('.cta-section');
          if (oldCta) {
            oldCta.insertAdjacentElement('beforebegin',buildFaq());
            oldCta.replaceWith(buildContact());
          } else {
            main.append(buildFaq(),buildContact());
          }

          root.replaceWith(main);
          document.body.prepend(header);
          document.body.append(footer);
          activateConsole();

          const constellationScript = document.createElement('script');
          constellationScript.src = './home-constellation.js?v=20260802-2';
          document.body.appendChild(constellationScript);
          document.documentElement.classList.remove('is-loading');
        })
        .catch(error => {
          const root = document.getElementById('homepage-root');
          if (root) root.innerHTML = `<section style="padding:4rem 2rem;font-family:Inter,sans-serif"><h1>Palomma Consulting</h1><p>${error.message}</p></section>`;
          document.documentElement.classList.remove('is-loading');
        });
    })();
  </script>
</body>
</html>
